<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>SYDE 572 Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f6f5f1; color: #1d2330; }
  header { background: linear-gradient(135deg, #121a2e, #1e3160); color: #fff; padding: 72px 24px 88px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(34px, 6vw, 52px); margin: 0 0 10px; }
  header p { color: #cfd8ee; font-size: 18px; margin: 0; }
  main { max-width: 900px; margin: -48px auto 60px; padding: 0 24px; display: grid; gap: 16px; }
  a.card { display: flex; gap: 20px; align-items: center; background: #fff; border-radius: 16px; padding: 20px;

           transition: transform .15s, box-shadow .15s; }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,30,60,.08), 0 16px 36px rgba(20,30,60,.12); }
  a.card img { width: 180px; height: 110px; object-fit: cover; border-radius: 10px; border: 1px solid #eee; flex-shrink: 0; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #2a78d6; }
  h2 { margin: 4px 0 6px; font-size: 21px; }
  a.card p { margin: 0; color: #4a4f5c; font-size: 15px; line-height: 1.5; }
  .soon { opacity: .55; pointer-events: none; }
  footer { text-align: center; color: #7a7e89; font-size: 13px; padding-bottom: 40px; }
  @media (max-width: 560px) { a.card { flex-direction: column; align-items: stretch; } a.card img { width: 100%; height: 150px; } }

<header><div class="wrap">
  <h1>SYDE 572 Portfolio</h1>
  <p>Amin Ambike · Introduction to Pattern Recognition</p>
</div></header>
<main>
  <a class="card" href="./1/index.html">
    <img src="./1/media/p1_overview.png" alt="Assignment 1 preview">
    <div>
      <div class="tag">Assignment 1</div>
      <h2>Distance to a curve &amp; least-squares fitting</h2>
      <p>Closest point on a curve with calculus, Newton-Raphson and golden-section search, then fitting a line and a parabola by minimising the MSE.</p>
    </div>
  </a>
</main>
<footer>Hosted on GitHub Pages</footer>
